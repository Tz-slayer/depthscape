name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Prebuilt Engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: depthscape-engine
            asset_name: depthscape-engine-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Static OpenCV
        uses: ./.github/actions/opencv-static

      - name: Build Engine
        working-directory: engine
        run: |
          cargo build --release --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      # The whole point of the static build: one file, no system OpenCV.
      - name: Verify the engine is self-contained
        run: |
          bin="engine/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if ldd "$bin" | grep -qi opencv; then
            echo "::error::engine still links OpenCV dynamically; refusing to publish"
            ldd "$bin" | grep -i opencv
            exit 1
          fi
          ldd "$bin"

      - name: Prepare Release Asset
        run: |
          cp engine/target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
