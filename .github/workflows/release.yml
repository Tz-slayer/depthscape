name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Prebuilt Engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: depthscape-engine
            asset_name: depthscape-engine-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate engine release pin
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          engine_tag=$(cat engine-version)
          if ! printf '%s\n' "$engine_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo '::error::engine-version must contain a release tag such as v0.6.0'
            exit 1
          fi
          if [ "$engine_tag" != "$RELEASE_TAG" ]; then
            git fetch --no-tags origin "refs/tags/$engine_tag:refs/tags/$engine_tag"
            if ! git diff --quiet "$engine_tag" HEAD -- engine/; then
              echo "::error::Engine sources differ from $engine_tag. Set engine-version to the current release tag."
              exit 1
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Engine
        working-directory: engine
        run: |
          cargo build --release --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Prepare Release Asset
        run: |
          cp engine/target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
